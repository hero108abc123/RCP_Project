<div class="card">
    <div class="flex flex-row justify-between items-center mb-4">
        <div class="font-semibold text-xl uppercase">Quản lý lịch chiếu phim</div>
    </div>
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="flex flex-row justify-between items-center space-x-2">
            <div class="flex flex-row justify-between items-center space-x-2 flex-1">
                <div class="flex flex-row items-center space-x-2 flex-1 max-w-2xl">
                    <p-iconfield class="w-full">
                        <p-inputicon class="pi pi-search" />
                        <input formControlName="search" pInputText type="text" placeholder="Tìm kiếm lịch chiếu..." class="w-full" />
                    </p-iconfield>
                    <p-button type="button" icon="pi pi-filter" label="Tìm kiếm theo" (onClick)="filterPanel.toggle($event)" [outlined]="true" styleClass="whitespace-nowrap" />
                </div>
            </div>
          
            <div class="flex flex-row items-center space-x-2">
                <p-button label="Tìm kiếm" type="submit" styleClass="w-32" />
                <p-button label="Thêm mới" styleClass="w-32" (onClick)="onOpenCreate()" type="button" />
            </div>
        </div>
        
        <p-popover #filterPanel [style]="{ width: '600px' }">
            <div class="flex flex-col space-y-4 p-4">
                <div>
                    <label for="idCinema" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Rạp chiếu</label>
                    <p-multiselect formControlName="idCinema" id="idCinema" [options]="listCinemas" optionLabel="name" optionValue="id" placeholder="Chọn rạp chiếu" [showClear]="true" styleClass="w-full" appendTo="body" [maxSelectedLabels]="1" selectedItemsLabel="{0} rạp đã chọn" />
                </div>
                
                <div>
                    <label for="idRoom" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Phòng chiếu</label>
                    <p-multiselect formControlName="idRoom" id="idRoom" [options]="listRooms" optionLabel="name" optionValue="id" placeholder="Chọn phòng chiếu" [showClear]="true" styleClass="w-full" appendTo="body" [disabled]="!searchForm.get('idCinema')?.value || searchForm.get('idCinema')?.value.length === 0" [maxSelectedLabels]="1" selectedItemsLabel="{0} phòng đã chọn" />
                </div>
                
                <div>
                    <label for="idTheLoai" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Thể loại phim</label>
                    <p-multiselect formControlName="idTheLoai" id="idTheLoai" [options]="listTheLoai" optionLabel="tenTheLoai" optionValue="id" placeholder="Chọn thể loại" [showClear]="true" styleClass="w-full" appendTo="body" [maxSelectedLabels]="1" selectedItemsLabel="{0} thể loại đã chọn" />
                </div>
                
                <div class="flex flex-row items-center space-x-4">
                    <div class="flex-1">
                        <label for="tuNgay" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Thời gian bắt đầu </label>
                        <p-datepicker formControlName="tuNgay" id="tuNgay" [showIcon]="true" [showOnFocus]="false" [showTime]="true" hourFormat="24" dateFormat="dd/mm/yy" placeholder="Chọn ngày bắt đầu" styleClass="w-full" appendTo="body" />
                    </div>
                    <div class="flex items-center pt-6">
                        <span class="text-surface-500">-</span>
                    </div>
                    <div class="flex-1">
                        <label for="denNgay" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Thời gian kết thúc</label>
                        <p-datepicker formControlName="denNgay" id="denNgay" [showIcon]="true" [showOnFocus]="false" [showTime]="true" hourFormat="24" dateFormat="dd/mm/yy" placeholder="Chọn ngày kết thúc" styleClass="w-full" appendTo="body" />
                    </div>
                </div>
            </div>
        </p-popover>
    </form>
    <div class="mt-4">
        <app-data-table [columns]="columns" [data]="data" [loading]="loading"  [total]="totalRecords" [pageNumber]="query.pageNumber" [pageSize]="query.pageSize" (onPageChanged)="onPageChanged($event)"    (onCustomComp)="onCustomEmit($event)" />
    </div>
</div>
