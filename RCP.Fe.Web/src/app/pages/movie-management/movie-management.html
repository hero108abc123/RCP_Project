<div class="card">
    <div class="flex flex-row justify-between items-center mb-4">
        <div class="font-semibold text-xl uppercase">Quản lý Phim theo phòng chiếu</div>
    </div>
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="flex flex-row justify-between items-center space-x-2">
            <div class="flex flex-row justify-between items-center space-x-2 flex-1">
                <div class="flex flex-row items-center space-x-2 flex-1 max-w-2xl">
                    <p-iconfield class="w-full">
                        <p-inputicon class="pi pi-search" />
                        <input formControlName="search" pInputText type="text" placeholder="Tìm kiếm phim..." class="w-full" />
                    </p-iconfield>
                    <p-button type="button" icon="pi pi-filter" label="Tìm kiếm theo" (onClick)="filterPanel.toggle($event)" [outlined]="true" styleClass="whitespace-nowrap" />
                </div>
            </div>
          
            <div class="flex flex-row items-center space-x-2">
                <p-button label="Tìm kiếm" type="submit" styleClass="w-32" />
                <p-button label="Thêm mới" styleClass="w-32" (onClick)="onOpenCreate()" type="button" />
            </div>
        </div>
        
        <p-popover #filterPanel [style]="{ width: '600px' }">
            <div class="flex flex-col space-y-4 p-4">
                <div>
                    <label for="idTheLoai" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Thể loại phim</label>
                    <p-multiselect formControlName="idTheLoai" id="idTheLoai" [options]="listTheLoai" optionLabel="tenTheLoai" optionValue="id" placeholder="Chọn thể loại" [showClear]="true" styleClass="w-full" appendTo="body" [maxSelectedLabels]="1" selectedItemsLabel="{0} thể loại đã chọn" />
                </div>

                <div>
                    <label for="dangChieu" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Trạng thái chiếu</label>
                    <p-select formControlName="dangChieu" id="dangChieu" [options]="dangChieuOptions" optionLabel="label" optionValue="value" placeholder="Chọn trạng thái" [showClear]="true" styleClass="w-full" appendTo="body" />
                </div>

                <div>
                    <label for="ngonNgu" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Ngôn ngữ</label>
                    <p-select formControlName="ngonNgu" id="ngonNgu" [options]="ngonNguOptions" optionLabel="label" optionValue="value" placeholder="Chọn ngôn ngữ" [filter]="true" filterPlaceholder="Tìm kiếm" [showClear]="true" styleClass="w-full" appendTo="body" />
                </div>

                <div>
                    <label for="phanLoaiDoTuoi" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Phân loại độ tuổi</label>
                    <p-multiselect formControlName="phanLoaiDoTuoi" id="phanLoaiDoTuoi" [options]="phanLoaiDoTuoiOptions" optionLabel="label" optionValue="value" placeholder="Chọn phân loại" [showClear]="true" styleClass="w-full" appendTo="body" [maxSelectedLabels]="1" selectedItemsLabel="{0} phân loại đã chọn" />
                </div>

                <div>
                    <label for="daoDien" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Đạo diễn</label>
                    <input pInputText id="daoDien" formControlName="daoDien" placeholder="Nhập tên đạo diễn" class="w-full" />
                </div>

                <div>
                    <label for="dienVien" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Diễn viên</label>
                    <input pInputText id="dienVien" formControlName="dienVien" placeholder="Nhập tên diễn viên" class="w-full" />
                </div>
                
                <div class="flex flex-row items-center space-x-4">
                    <div class="flex-1">
                        <label for="tuNgay" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Ngày khởi chiếu từ</label>
                        <p-datepicker formControlName="tuNgay" id="tuNgay" [showIcon]="true" [showOnFocus]="false" dateFormat="dd/mm/yy" placeholder="Chọn ngày bắt đầu" styleClass="w-full" appendTo="body" />
                    </div>
                    <div class="flex items-center pt-6">
                        <span class="text-surface-500">-</span>
                    </div>
                    <div class="flex-1">
                        <label for="denNgay" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Ngày khởi chiếu đến</label>
                        <p-datepicker formControlName="denNgay" id="denNgay" [showIcon]="true" [showOnFocus]="false" dateFormat="dd/mm/yy" placeholder="Chọn ngày kết thúc" styleClass="w-full" appendTo="body" />
                    </div>
                </div>
            </div>
        </p-popover>
    </form>
    <div class="mt-4">
        <app-data-table [columns]="columns" [data]="data" [loading]="loading" [total]="totalRecords" [pageNumber]="query.pageNumber" [pageSize]="query.pageSize" (onPageChanged)="onPageChanged($event)" (onCustomComp)="onCustomEmit($event)" />
    </div>
</div>
