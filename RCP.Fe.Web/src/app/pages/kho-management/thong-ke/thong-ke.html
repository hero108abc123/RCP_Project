<div class="card">
    <div class="flex flex-row justify-between items-center mb-4">
        <div class="font-semibold text-xl uppercase">Quản lý thống kê kho</div>
    </div>
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="flex flex-row justify-between items-center space-x-2">
            <div class="flex flex-row justify-between items-center space-x-2 flex-1">
                <div class="flex flex-row items-center space-x-2 flex-1 max-w-2xl">
                    <p-iconfield class="w-full">
                        <p-inputicon class="pi pi-search" />
                        <input formControlName="search" pInputText type="text" placeholder="Tìm kiếm thống kê kho..." class="w-full" />
                    </p-iconfield>
                    <p-button type="button" icon="pi pi-filter" label="Tìm kiếm theo" (onClick)="filterPanel.toggle($event)" [outlined]="true" styleClass="whitespace-nowrap" />
                </div>
            </div>
          
            <div class="flex flex-row items-center space-x-2">
                <p-button label="Tìm kiếm" type="submit" styleClass="w-32" />
              
            </div>
        </div>
        
        <p-popover #filterPanel [style]="{ width: '600px' }">
            <div class="flex flex-col space-y-4 p-4">
                <div>
                    <label for="idCinema" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Rạp chiếu</label>
                    <p-select formControlName="idCinema" id="idCinema" [options]="listCinemas" optionLabel="name" optionValue="id" placeholder="Chọn rạp chiếu" [showClear]="true" styleClass="w-full" (onChange)="onCinemaChange($event)" />
                </div>
                
                <div>
                    <label for="idKho" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Kho</label>
                    <p-select formControlName="idKho" id="idKho" [options]="listKhos" optionLabel="tenKho" optionValue="id" placeholder="Chọn kho" [showClear]="true" styleClass="w-full" [disabled]="!searchForm.get('idCinema')?.value" />
                </div>
                
                <div>
                    <label for="idMatHang" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Mặt hàng</label>
                    <p-select formControlName="idMatHang" id="idMatHang" [options]="listMatHangs" optionLabel="tenMon" optionValue="id" placeholder="Chọn mặt hàng" [showClear]="true" styleClass="w-full" />
                </div>
                
                <div>
                    <label for="ngayNhap" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Ngày nhập</label>
                    <p-datepicker formControlName="ngayNhap" id="ngayNhap" [showIcon]="true" [showOnFocus]="false" dateFormat="dd/mm/yy" placeholder="Chọn ngày nhập" styleClass="w-full" />
                </div>
            </div>
        </p-popover>
    </form>
    <div class="mt-4">
        <app-data-table [columns]="columns" [data]="data" [loading]="loading"  [total]="totalRecords" [pageNumber]="query.pageNumber" [pageSize]="query.pageSize" (onPageChanged)="onPageChanged($event)"  />
    </div>
</div>
